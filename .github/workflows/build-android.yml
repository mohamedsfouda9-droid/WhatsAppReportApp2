name: Android CI from ZIP

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2

    - name: Extract ZIP and Setup Project Structure
      run: |
        echo "=== Listing repository files ==="
        ls -la
        
        # إنشاء مجلد العمل وفك ضغط الـ ZIP
        mkdir -p extracted_project/app/src/main/java/com/example/whatsappreportapp2
        mkdir -p extracted_project/app/src/main/res/layout
        mkdir -p extracted_project/app/src/main/res/drawable
        
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Extracting $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d extracted_project/app/src/main/java/com/example/whatsappreportapp2/ || true
          # في حال الملفات فكت في الجذر المباشر
          unzip -o "$ZIP_FILE" -d extracted_project/ || true
        fi

        # إنشاء ملفات إعدادات الجريدل الجذرية تلقائياً لضمان نجاح البيلد
        cd extracted_project
        
        if [ ! -f "settings.gradle" ]; then
          echo 'rootProject.name = "WhatsAppReportApp2"' > settings.gradle
          echo "include ':app'" >> settings.gradle
        fi

        if [ ! -f "build.gradle" ]; then
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath "com.android.tools.build:gradle:8.1.0"
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.0"
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF
        fi

        if [ ! -f "app/build.gradle" ]; then
          mkdir -p app
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.whatsappreportapp2'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.whatsappreportapp2"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
          }
          EOF
        fi

        if [ ! -f "app/src/main/AndroidManifest.xml" ]; then
          mkdir -p app/src/main
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="WhatsAppReport"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                  <activity
                      android:name=".BanTermsActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
        fi

    - name: Build Debug APK
      run: |
        cd extracted_project
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: '**/app/build/outputs/apk/debug/app-debug.apk'
