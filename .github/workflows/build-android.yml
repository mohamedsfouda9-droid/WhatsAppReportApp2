name: Android CI from ZIP

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Extract and Structure Project
      run: |
        mkdir -p extracted_project/app/src/main/java/com/example/whatsappreportapp2
        mkdir -p extracted_project/app/src/main/res
        
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Extracting contents from $ZIP_FILE..."
          mkdir -p temp_extracted
          unzip -o "$ZIP_FILE" -d temp_extracted/
          
          find temp_extracted -name "*.kt" -exec cp {} extracted_project/app/src/main/java/com/example/whatsappreportapp2/ \; || true
          find temp_extracted -name "*.java" -exec cp {} extracted_project/app/src/main/java/com/example/whatsappreportapp2/ \; || true
          
          if [ -d "temp_extracted/res" ]; then
            cp -r temp_extracted/res/* extracted_project/app/src/main/res/ || true
          elif [ -d "temp_extracted/app/src/main/res" ]; then
            cp -r temp_extracted/app/src/main/res/* extracted_project/app/src/main/res/ || true
          fi
        fi

        cd extracted_project
        
        echo 'rootProject.name = "WhatsAppReportApp2"' > settings.gradle
        echo "include ':app'" >> settings.gradle

        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
            dependencies {
                classpath "com.android.tools.build:gradle:7.4.2"
                classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.0"
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }
        android {
            namespace 'com.example.whatsappreportapp2'
            compileSdk 33
            defaultConfig {
                applicationId "com.example.whatsappreportapp2"
                minSdk 24
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.9.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:label="WhatsAppReport"
                android:roundIcon="@mipmap/ic_launcher_round"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                <activity
                    android:name=".BanTermsActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

    - name: Build Debug APK with Gradle 7.5
      run: |
        cd extracted_project
        wget https://services.gradle.org/distributions/gradle-7.5-bin.zip
        unzip -q gradle-7.5-bin.zip
        export PATH=$PWD/gradle-7.5/bin:$PATH
        
        gradle wrapper --gradle-version 7.5
        chmod +x gradlew
        # استخدام assembleDebug مباشرة بدون طباعة معلومات زايدة توقف البيلد
        ./gradlew assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: '**/app/build/outputs/apk/debug/app-debug.apk'
