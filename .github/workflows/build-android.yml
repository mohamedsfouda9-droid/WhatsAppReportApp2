name: Android CI from ZIP

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2

    - name: Unzip and locate project
      run: |
        echo "=== Listing root files ==="
        ls -la
        
        # إنشاء مجلد وفك أول ملف ZIP يلاقيه
        mkdir -p extracted_project
        ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
        
        if [ -n "$ZIP_FILE" ]; then
          echo "Extracting $ZIP_FILE..."
          unzip -o "$ZIP_FILE" -d extracted_project
        else
          echo "Error: No ZIP file found!"
          exit 1
        fi
        
        echo "=== Extracted Contents ==="
        ls -la extracted_project

    - name: Build Debug APK
      run: |
        # البحث أوتوماتيكياً عن المجلد الذي يحتوي على settings.gradle والدخول إليه
        PROJECT_PATH=$(find extracted_project -name "settings.gradle" -exec dirname {} \; | head -n 1)
        
        if [ -z "$PROJECT_PATH" ]; then
          echo "Error: settings.gradle not found in extracted files!"
          exit 1
        fi
        
        echo "Found project at: $PROJECT_PATH"
        cd "$PROJECT_PATH"
        
        # توليد الـ Wrapper وبناء التطبيق
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: '**/app/build/outputs/apk/debug/app-debug.apk'
