name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2

    - name: Locate project directory and build
      run: |
        # البحث عن مكان ملف settings.gradle تلقائياً في المستودع والدخول إليه
        PROJECT_DIR=$(find . -name "settings.gradle" -maxdepth 3 -exec dirname {} \;)
        echo "Found project directory at: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        
        # توليد الWrapper وبناء الـ APK من نفس المجلد الصحيح
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: '**/app/build/outputs/apk/debug/app-debug.apk'
