name: Build WhatsAppReportApp2 APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0"

      - name: Find project ZIP
        id: findzip
        shell: bash
        run: |
          ZIP_FILE=$(find . -type f -iname "WhatsAppReportApp2.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: WhatsAppReportApp2.zip not found."
            echo "Files in repository:"
            find . -maxdepth 5 -type f
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract project ZIP
        run: |
          mkdir -p extracted
          unzip -q "${{ steps.findzip.outputs.zip_file }}" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 5 -type f

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          SETTINGS=$(find extracted -type f -name settings.gradle -print -quit)

          if [ -z "$SETTINGS" ]; then
            SETTINGS=$(find extracted -type f -name settings.gradle.kts -print -quit)
          fi

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project settings file not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle was not found."
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: |
          gradle --no-daemon \
            -p "${{ steps.project.outputs.project_dir }}" \
            assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WhatsAppReportApp2-debug-apk
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
