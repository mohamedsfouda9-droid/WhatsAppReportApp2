name: Android CI from ZIP

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2

    - name: Unzip project file
      run: |
        echo "=== Listing files in root ==="
        ls -la
        
        # البحث عن أي ملف ضغط في المستودع وفكه تلقائياً
        ZIP_FILE=$(find . -name "*.zip" | head -n 1)
        if [ -n "$ZIP_FILE" ]; then
          echo "Found ZIP file: $ZIP_FILE, extracting..."
          unzip -o "$ZIP_FILE" -d extracted_project
        else
          echo "Error: No ZIP file found in repository!"
          exit 1
        fi

    - name: Build Debug APK
      run: |
        # الانتقال للمجلد المستخرج وبناء المشروع
        cd extracted_project/WhatsAppReportApp2   # (أو المجلد الناتج من فك الضغط)
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: '**/app/build/outputs/apk/debug/app-debug.apk'
