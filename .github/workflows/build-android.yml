name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2

    - name: Build Debug APK
      working-directory: ./WhatsAppReportApp2   # <--- ضع هنا اسم المجلد الموجود فيه ملفات المشروع الرئيسية (الذي يحتوي على settings.gradle)
      run: ./gradlew assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: WhatsAppReportApp2/app/build/outputs/apk/debug/app-debug.apk   # <--- تحديث مسار الناتج أيضاً ليطابق المجلد
